<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>מוכנים לכיתה א'!</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #FDF8F2;
  --card: #FFFFFF;
  --purple: #7B5EA7;
  --purple-light: #EDE8F5;
  --teal: #2E9E82;
  --teal-light: #E0F4EE;
  --coral: #E0634A;
  --coral-light: #FAEAE6;
  --amber: #E8A020;
  --amber-light: #FDF3E0;
  --text: #1A1A2E;
  --text-muted: #6B6B80;
  --border: rgba(0,0,0,0.08);
  --radius: 16px;
  --radius-sm: 10px;
  --shadow: 0 2px 12px rgba(0,0,0,0.07);
  --shadow-lg: 0 8px 32px rgba(0,0,0,0.12);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Heebo', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  direction: rtl;
}

/* Header */
.header {
  background: var(--purple);
  color: white;
  padding: 20px 24px 16px;
  text-align: center;
  position: relative;
}
.header h1 { font-size: 26px; font-weight: 900; letter-spacing: -0.5px; }
.header p { font-size: 14px; opacity: 0.8; margin-top: 4px; }
.speak-indicator {
  position: absolute; top: 16px; left: 16px;
  width: 36px; height: 36px; border-radius: 50%;
  background: rgba(255,255,255,0.2);
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; cursor: pointer;
  transition: background 0.2s;
}
.speak-indicator.speaking { background: rgba(255,255,255,0.4); animation: pulse 0.8s infinite; }
@keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.1)} }

/* Tabs */
.tabs {
  display: flex; background: white;
  border-bottom: 1px solid var(--border);
  overflow-x: auto; -webkit-overflow-scrolling: touch;
}
.tab {
  flex: 1; padding: 14px 8px; border: none; background: none;
  font-family: 'Heebo', sans-serif; font-size: 14px; font-weight: 500;
  color: var(--text-muted); cursor: pointer; white-space: nowrap;
  border-bottom: 3px solid transparent; transition: all 0.2s;
}
.tab.active { color: var(--purple); border-bottom-color: var(--purple); }
.tab-icon { display: block; font-size: 22px; margin-bottom: 2px; }

/* Screens */
.screen { display: none; padding: 16px; max-width: 600px; margin: 0 auto; }
.screen.active { display: block; }

/* Score bar */
.score-bar {
  display: flex; align-items: center; justify-content: space-between;
  background: white; border-radius: var(--radius-sm); padding: 10px 16px;
  margin-bottom: 16px; border: 1px solid var(--border);
}
.score-label { font-size: 13px; color: var(--text-muted); }
.score-val { font-size: 22px; font-weight: 900; color: var(--purple); }
.sub-tabs { display: flex; gap: 6px; }
.sub-tab {
  padding: 6px 12px; border-radius: 20px; border: 1px solid var(--border);
  font-size: 12px; font-weight: 500; cursor: pointer; background: var(--bg);
  color: var(--text-muted); transition: all 0.15s; font-family: 'Heebo', sans-serif;
}
.sub-tab.active { background: var(--purple-light); border-color: var(--purple); color: var(--purple); }

/* Question card */
.q-card {
  background: white; border-radius: var(--radius);
  padding: 24px 20px; margin-bottom: 14px;
  border: 1px solid var(--border); box-shadow: var(--shadow);
  text-align: center;
}
.q-text {
  font-size: 32px; font-weight: 700; color: var(--text);
  line-height: 1.3; margin-bottom: 20px; white-space: pre-wrap;
}
.speak-btn {
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--purple-light); color: var(--purple);
  border: none; border-radius: 20px; padding: 8px 16px;
  font-size: 14px; font-weight: 500; cursor: pointer;
  font-family: 'Heebo', sans-serif; margin-bottom: 20px;
  transition: background 0.15s;
}
.speak-btn:hover { background: #D8D0EE; }
.speak-btn.big { font-size: 16px; padding: 10px 22px; }

/* Options */
.options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.opt-btn {
  padding: 16px 8px; border-radius: var(--radius-sm);
  border: 1.5px solid var(--border); background: white;
  cursor: pointer; font-size: 22px; font-weight: 700;
  color: var(--text); transition: all 0.15s;
  font-family: 'Heebo', sans-serif;
}
.opt-btn:hover { border-color: var(--purple); background: var(--purple-light); }
.opt-btn.correct { background: var(--teal-light); border-color: var(--teal); color: var(--teal); }
.opt-btn.wrong { background: var(--coral-light); border-color: var(--coral); color: var(--coral); }
.opt-btn:disabled { cursor: default; }

/* Feedback */
.feedback {
  text-align: center; font-size: 22px; font-weight: 700;
  min-height: 36px; margin: 10px 0;
}
.feedback.good { color: var(--teal); }
.feedback.bad { color: var(--coral); }

/* Next button */
.next-btn {
  width: 100%; padding: 14px; border-radius: var(--radius-sm);
  border: none; background: var(--purple); color: white;
  font-size: 16px; font-weight: 700; cursor: pointer;
  font-family: 'Heebo', sans-serif; margin-top: 6px;
  transition: background 0.15s;
}
.next-btn:hover { background: #6B4E93; }

/* Letters */
.letters-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(72px,1fr));
  gap: 8px; margin-bottom: 16px;
}
.letter-tile {
  background: white; border: 1.5px solid var(--border);
  border-radius: var(--radius-sm); padding: 14px 6px;
  text-align: center; cursor: pointer; transition: all 0.15s;
}
.letter-tile:hover, .letter-tile.selected {
  border-color: var(--purple); background: var(--purple-light);
}
.letter-big { font-size: 34px; font-weight: 700; }
.letter-name { font-size: 10px; color: var(--text-muted); margin-top: 3px; }
.letter-detail {
  background: white; border: 1px solid var(--border);
  border-radius: var(--radius); padding: 24px; text-align: center;
  box-shadow: var(--shadow);
}
.detail-letter { font-size: 80px; font-weight: 900; color: var(--purple); line-height: 1; }
.detail-name { font-size: 20px; color: var(--text-muted); margin: 8px 0; }
.detail-word { font-size: 24px; font-weight: 700; margin-top: 12px; }
.detail-example { font-size: 16px; color: var(--text-muted); margin-top: 6px; }

/* Writing */
.write-card {
  background: white; border: 1px solid var(--border);
  border-radius: var(--radius); padding: 24px; box-shadow: var(--shadow);
}
.write-prompt { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
.write-hint { font-size: 15px; color: var(--text-muted); margin-bottom: 16px; }
.write-boxes { display: flex; gap: 8px; justify-content: center; margin-bottom: 20px; flex-wrap: wrap; }
.letter-box {
  width: 52px; height: 60px; border: 2px solid var(--border);
  border-radius: var(--radius-sm); display: flex; align-items: center;
  justify-content: center; font-size: 28px; font-weight: 700;
  background: var(--bg); transition: all 0.3s;
}
.letter-box.filled { border-color: var(--purple); background: var(--purple-light); color: var(--purple); }
.letter-box.correct { border-color: var(--teal); background: var(--teal-light); color: var(--teal); }
.letter-box.wrong { border-color: var(--coral); background: var(--coral-light); color: var(--coral); }
.keyboard { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-bottom: 16px; }
.key-btn {
  width: 44px; height: 44px; border-radius: 8px;
  border: 1.5px solid var(--border); background: white;
  font-size: 20px; font-weight: 700; cursor: pointer;
  font-family: 'Heebo', sans-serif; color: var(--text);
  transition: all 0.1s; display: flex; align-items: center; justify-content: center;
}
.key-btn:hover { background: var(--purple-light); border-color: var(--purple); }
.key-btn.del { font-size: 14px; color: var(--coral); }
.write-result { text-align: center; font-size: 20px; font-weight: 700; min-height: 30px; margin: 8px 0; }

/* World */
.continent-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
.continent-card {
  background: white; border: 1.5px solid var(--border);
  border-radius: var(--radius); padding: 16px; cursor: pointer; transition: all 0.15s;
  text-align: center;
}
.continent-card:hover { border-color: var(--teal); }
.continent-card.selected { border-color: var(--teal); background: var(--teal-light); }
.cont-emoji { font-size: 32px; display: block; margin-bottom: 6px; }
.cont-name { font-size: 15px; font-weight: 700; }
.countries-list {
  background: white; border: 1px solid var(--border);
  border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow);
}
.countries-title { font-size: 16px; font-weight: 700; color: var(--text-muted); margin-bottom: 12px; }
.country-row {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 0; border-bottom: 1px solid var(--border);
}
.country-row:last-child { border-bottom: none; }
.country-flag { font-size: 26px; }
.country-name-heb { font-size: 16px; font-weight: 700; }
.country-capital { font-size: 13px; color: var(--text-muted); }

/* Responsive */
@media (max-width: 400px) {
  .q-text { font-size: 26px; }
  .key-btn { width: 38px; height: 38px; font-size: 18px; }
  .letter-box { width: 44px; height: 52px; font-size: 24px; }
}
</style>
</head>
<body>

<div class="header">
  <div class="speak-indicator" id="speakIndicator" title="הקראה">🔊</div>
  <h1>🎒 מוכנים לכיתה א'!</h1>
  <p>לומדים ביחד בכיף</p>
</div>

<div class="tabs">
  <button class="tab active" onclick="showTab('math',this)">
    <span class="tab-icon">🔢</span>חשבון
  </button>
  <button class="tab" onclick="showTab('reading',this)">
    <span class="tab-icon">📖</span>קריאה
  </button>
  <button class="tab" onclick="showTab('world',this)">
    <span class="tab-icon">🌍</span>עולם
  </button>
</div>

<!-- ===== MATH ===== -->
<div class="screen active" id="screen-math">
  <div class="score-bar">
    <span class="score-label">כוכבים ⭐</span>
    <span class="score-val" id="math-score">0</span>
    <div class="sub-tabs">
      <button class="sub-tab active" id="btn-add" onclick="setMathMode('add',this)">➕ חיבור</button>
      <button class="sub-tab" id="btn-sub" onclick="setMathMode('sub',this)">➖ חיסור</button>
      <button class="sub-tab" id="btn-count" onclick="setMathMode('count',this)">🔢 ספירה</button>
    </div>
  </div>
  <div class="q-card">
    <div class="q-text" id="math-question">...</div>
    <button class="speak-btn big" onclick="speakCurrent('math')">🔊 שמע את השאלה</button>
    <div class="options" id="math-options"></div>
  </div>
  <div class="feedback" id="math-feedback"></div>
  <button class="next-btn" id="math-next" onclick="nextMath()" style="display:none">השאלה הבאה ▶</button>
</div>

<!-- ===== READING ===== -->
<div class="screen" id="screen-reading">
  <div class="sub-tabs" style="margin-bottom:16px; justify-content:center; display:flex; gap:8px;">
    <button class="sub-tab active" id="rtab-letters" onclick="setReadMode('letters',this)">🔤 אותיות</button>
    <button class="sub-tab" id="rtab-write" onclick="setReadMode('write',this)">✏️ כתיבה</button>
    <button class="sub-tab" id="rtab-quiz" onclick="setReadMode('quiz',this)">🎯 חידון</button>
  </div>

  <div id="read-letters">
    <div class="letters-grid" id="letters-grid"></div>
    <div class="letter-detail" id="letter-detail" style="display:none"></div>
  </div>

  <div id="read-write" style="display:none">
    <div class="write-card">
      <div class="write-prompt" id="write-prompt"></div>
      <div class="write-hint" id="write-hint"></div>
      <button class="speak-btn" onclick="speakWriteWord()">🔊 שמע את המילה</button>
      <div class="write-boxes" id="write-boxes"></div>
      <div class="keyboard" id="keyboard"></div>
      <div class="write-result" id="write-result"></div>
    </div>
    <button class="next-btn" onclick="nextWriting()" style="margin-top:12px">מילה הבאה ▶</button>
  </div>

  <div id="read-quiz" style="display:none">
    <div class="score-bar">
      <span class="score-label">כוכבים ⭐</span>
      <span class="score-val" id="read-score">0</span>
    </div>
    <div class="q-card">
      <div class="q-text" id="read-question"></div>
      <button class="speak-btn big" onclick="speakCurrent('read')">🔊 שמע שוב</button>
      <div class="options" id="read-options" style="grid-template-columns:1fr 1fr"></div>
    </div>
    <div class="feedback" id="read-feedback"></div>
    <button class="next-btn" id="read-next" onclick="nextReadQuiz()" style="display:none">המשך ▶</button>
  </div>
</div>

<!-- ===== WORLD ===== -->
<div class="screen" id="screen-world">
  <div class="sub-tabs" style="margin-bottom:16px; justify-content:center; display:flex; gap:8px;">
    <button class="sub-tab active" id="wtab-explore" onclick="setWorldMode('explore',this)">🗺️ חקירה</button>
    <button class="sub-tab" id="wtab-quiz" onclick="setWorldMode('quiz',this)">🎯 חידון</button>
  </div>

  <div id="world-explore">
    <div class="continent-grid" id="continent-grid"></div>
    <div class="countries-list" id="countries-list" style="display:none">
      <div class="countries-title" id="continent-title"></div>
      <div id="countries-content"></div>
    </div>
  </div>

  <div id="world-quiz" style="display:none">
    <div class="score-bar">
      <span class="score-label">כוכבים ⭐</span>
      <span class="score-val" id="world-score">0</span>
    </div>
    <div class="q-card">
      <div class="q-text" id="world-question"></div>
      <button class="speak-btn big" onclick="speakCurrent('world')">🔊 שמע שוב</button>
      <div class="options" id="world-options"></div>
    </div>
    <div class="feedback" id="world-feedback"></div>
    <button class="next-btn" id="world-next" onclick="nextWorldQuiz()" style="display:none">המשך ▶</button>
  </div>
</div>

<script>
// ===== TTS =====
let synth = window.speechSynthesis;
let heVoice = null;
let currentTexts = { math:'', read:'', world:'' };

function loadVoices() {
  const voices = synth.getVoices();
  heVoice = voices.find(v => v.lang.startsWith('he')) ||
            voices.find(v => v.lang.startsWith('iw')) || null;
}
loadVoices();
if (synth.onvoiceschanged !== undefined) synth.onvoiceschanged = loadVoices;

let userInteracted = false;
document.addEventListener('click', () => { userInteracted = true; }, { once: true });

function speak(text) {
  if (!text || !userInteracted) return;
  try {
    synth.cancel();
    const utt = new SpeechSynthesisUtterance(text);
    utt.lang = 'he-IL';
    utt.rate = 0.85;
    utt.pitch = 1.1;
    if (heVoice) utt.voice = heVoice;
    const ind = document.getElementById('speakIndicator');
    utt.onstart = () => ind.classList.add('speaking');
    utt.onend = () => ind.classList.remove('speaking');
    utt.onerror = () => ind.classList.remove('speaking');
    synth.speak(utt);
  } catch(e) { console.log('TTS error:', e); }
}

function speakCurrent(module) { speak(currentTexts[module]); }
function speakWriteWord() { if(currentWriteWord) speak(currentWriteWord.word); }

// ===== NAV =====
function showTab(t, btn) {
  document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('screen-' + t).classList.add('active');
}

// ===== MATH =====
let mathScore = 0, mathMode = 'add', mathAnswered = false, currentMathQ = null;

function setMathMode(m, btn) {
  mathMode = m;
  document.querySelectorAll('.sub-tabs .sub-tab').forEach(b => {
    if(b.id && b.id.startsWith('btn-')) b.classList.remove('active');
  });
  btn.classList.add('active');
  nextMath();
}

function genMathQ() {
  let q = '', ans, opts = [];
  if (mathMode === 'add') {
    const a = Math.floor(Math.random()*9)+1, b = Math.floor(Math.random()*9)+1;
    ans = a + b; q = `${a} + ${b} = ?`;
    currentTexts.math = `כמה זה ${a} ועוד ${b}?`;
  } else if (mathMode === 'sub') {
    const a = Math.floor(Math.random()*9)+2, b = Math.floor(Math.random()*(a-1))+1;
    ans = a - b; q = `${a} - ${b} = ?`;
    currentTexts.math = `כמה זה ${a} פחות ${b}?`;
  } else {
    const items = ['⭐','🍎','🐟','🌸','🦋'];
    const item = items[Math.floor(Math.random()*items.length)];
    ans = Math.floor(Math.random()*8)+2;
    q = item.repeat(ans) + '\nספור/י כמה יש!';
    currentTexts.math = `ספור ${ans} ${item === '⭐' ? 'כוכבים' : 'פריטים'}. כמה יש?`;
  }
  const wrongs = new Set();
  while (wrongs.size < 3) { const w = ans + Math.floor(Math.random()*5) - 2; if (w !== ans && w > 0) wrongs.add(w); }
  opts = [ans, ...wrongs].sort(() => Math.random() - 0.5);
  return { q, ans, opts };
}

function nextMath() {
  mathAnswered = false;
  currentMathQ = genMathQ();
  document.getElementById('math-question').textContent = currentMathQ.q;
  document.getElementById('math-feedback').textContent = '';
  document.getElementById('math-next').style.display = 'none';
  const cont = document.getElementById('math-options'); cont.innerHTML = '';
  currentMathQ.opts.forEach(o => {
    const b = document.createElement('button');
    b.className = 'opt-btn'; b.textContent = o;
    b.onclick = () => answerMath(o, b);
    cont.appendChild(b);
  });
  speak(currentTexts.math);
}

function answerMath(val, btn) {
  if (mathAnswered) return; mathAnswered = true;
  document.querySelectorAll('#math-options .opt-btn').forEach(b => { b.disabled = true; if (+b.textContent === currentMathQ.ans) b.classList.add('correct'); });
  const fb = document.getElementById('math-feedback');
  if (val === currentMathQ.ans) {
    btn.classList.add('correct'); fb.textContent = 'כל הכבוד! 🌟'; fb.className = 'feedback good';
    mathScore++; document.getElementById('math-score').textContent = mathScore;
    speak('כל הכבוד! נכון מאוד!');
  } else {
    btn.classList.add('wrong'); fb.textContent = `לא נכון. התשובה: ${currentMathQ.ans}`; fb.className = 'feedback bad';
    speak(`לא נכון. התשובה הנכונה היא ${currentMathQ.ans}`);
  }
  document.getElementById('math-next').style.display = 'block';
}

// ===== LETTERS =====
const hebrewLetters = [
  {l:'א',name:'אָלֶף',word:'אֲרִי',ex:'ארי חזק'},
  {l:'ב',name:'בֵּית',word:'בַּיִת',ex:'בית גדול'},
  {l:'ג',name:'גִּימֶל',word:'גַּן',ex:'גן יפה'},
  {l:'ד',name:'דָּלֶת',word:'דָּג',ex:'דג כתום'},
  {l:'ה',name:'הֵא',word:'הַר',ex:'הר גבוה'},
  {l:'ו',name:'וָו',word:'וֶרֶד',ex:'ורד אדום'},
  {l:'ז',name:'זַיִן',word:'זֵבֶל',ex:'זבל'},
  {l:'ח',name:'חֵית',word:'חָלָב',ex:'חלב לבן'},
  {l:'ט',name:'טֵית',word:'טַבַּעַת',ex:'טבעת'},
  {l:'י',name:'יוֹד',word:'יַד',ex:'יד אחת'},
  {l:'כ',name:'כַּף',word:'כַּדּוּר',ex:'כדור עגול'},
  {l:'ל',name:'לָמֶד',word:'לֵב',ex:'לב אוהב'},
  {l:'מ',name:'מֵם',word:'מַיִם',ex:'מים קרים'},
  {l:'נ',name:'נוּן',word:'נֵר',ex:'נר דולק'},
  {l:'ס',name:'סָמֶך',word:'סֵפֶר',ex:'ספר מעניין'},
  {l:'ע',name:'עַיִן',word:'עֵץ',ex:'עץ גדול'},
  {l:'פ',name:'פֵּא',word:'פֶּרַח',ex:'פרח יפה'},
  {l:'צ',name:'צָדִי',word:'צִיפּוֹר',ex:'ציפור שרה'},
  {l:'ק',name:'קוֹף',word:'קוֹף',ex:'קוף מצחיק'},
  {l:'ר',name:'רֵישׁ',word:'רֶגֶל',ex:'רגל'},
  {l:'ש',name:'שִׁין',word:'שֶׁמֶשׁ',ex:'שמש זורחת'},
  {l:'ת',name:'תָּו',word:'תַּפּוּחַ',ex:'תפוח אדום'},
];

function initLetters() {
  const g = document.getElementById('letters-grid'); g.innerHTML = '';
  hebrewLetters.forEach(lt => {
    const d = document.createElement('div'); d.className = 'letter-tile';
    d.innerHTML = `<div class="letter-big">${lt.l}</div><div class="letter-name">${lt.name}</div>`;
    d.onclick = () => showLetterDetail(lt, d);
    g.appendChild(d);
  });
}

function showLetterDetail(lt, tile) {
  document.querySelectorAll('.letter-tile').forEach(t => t.classList.remove('selected'));
  tile.classList.add('selected');
  const det = document.getElementById('letter-detail');
  det.style.display = 'block';
  det.innerHTML = `
    <div class="detail-letter">${lt.l}</div>
    <div class="detail-name">${lt.name}</div>
    <div class="detail-word">מילה לדוגמה: ${lt.word}</div>
    <div class="detail-example">${lt.ex}</div>
    <button class="speak-btn big" style="margin-top:16px" onclick="speak('האות ${lt.name}. ${lt.word}. ${lt.ex}')">🔊 שמע</button>
  `;
  speak(`האות ${lt.name}. מילה לדוגמה: ${lt.word.replace(/[\u0591-\u05C7]/g,'')}`);
}

// ===== WRITING =====
const writingWords = [
  {word:'אמא',hint:'מי שמטפלת בנו'},
  {word:'אבא',hint:'מי שמשחק איתנו'},
  {word:'שלום',hint:'ברכה בעברית'},
  {word:'ילד',hint:'בן קטן'},
  {word:'ילדה',hint:'בת קטנה'},
  {word:'ספר',hint:'קוראים בו'},
  {word:'מים',hint:'שותים אותם'},
  {word:'כלב',hint:'חיית מחמד - הב הב'},
  {word:'חתול',hint:'מיאו...'},
  {word:'בית',hint:'גרים בו'},
  {word:'גן',hint:'הולכים לפני בית ספר'},
  {word:'ירח',hint:'זורח בלילה'},
  {word:'שמש',hint:'זורחת ביום'},
  {word:'דג',hint:'שוחה במים'},
];

let writingShuffled = [], currentWriteIdx = 0, currentWriteWord = null, writeInput = [];
const allLetters = 'אבגדהוזחטיכלמנסעפצקרשת'.split('');

function initWriting() {
  writingShuffled = [...writingWords].sort(() => Math.random() - 0.5);
  currentWriteIdx = 0;
  showWritingWord();
}

function showWritingWord() {
  currentWriteWord = writingShuffled[currentWriteIdx % writingShuffled.length];
  writeInput = [];
  document.getElementById('write-prompt').textContent = `🔍 ${currentWriteWord.hint}`;
  document.getElementById('write-hint').textContent = `המילה בת ${currentWriteWord.word.length} אותיות`;
  document.getElementById('write-result').textContent = '';
  renderBoxes();
  renderKeyboard();
  speak(`${currentWriteWord.hint}. כתוב את המילה. ${currentWriteWord.word.length} אותיות.`);
}

function renderBoxes() {
  const cont = document.getElementById('write-boxes'); cont.innerHTML = '';
  for (let i = 0; i < currentWriteWord.word.length; i++) {
    const d = document.createElement('div'); d.className = 'letter-box';
    d.id = 'box-' + i;
    if (writeInput[i]) { d.textContent = writeInput[i]; d.classList.add('filled'); }
    cont.appendChild(d);
  }
}

function renderKeyboard() {
  const cont = document.getElementById('keyboard'); cont.innerHTML = '';
  allLetters.forEach(l => {
    const b = document.createElement('button');
    b.className = 'key-btn'; b.textContent = l;
    b.onclick = () => typeKey(l);
    cont.appendChild(b);
  });
  const del = document.createElement('button');
  del.className = 'key-btn del'; del.textContent = '⌫';
  del.onclick = () => deleteKey();
  cont.appendChild(del);
}

function typeKey(l) {
  if (writeInput.length >= currentWriteWord.word.length) return;
  writeInput.push(l);
  renderBoxes();
  if (writeInput.length === currentWriteWord.word.length) checkWrite();
}

function deleteKey() {
  if (writeInput.length === 0) return;
  writeInput.pop();
  document.getElementById('write-result').textContent = '';
  renderBoxes();
}

function checkWrite() {
  const typed = writeInput.join('');
  const res = document.getElementById('write-result');
  const boxes = document.querySelectorAll('.letter-box');
  if (typed === currentWriteWord.word) {
    boxes.forEach(b => b.classList.replace('filled','correct'));
    res.style.color = 'var(--teal)'; res.textContent = 'מצוין! ✅';
    speak(`מצוין! כתבת נכון: ${currentWriteWord.word}`);
  } else {
    writeInput.forEach((ch, i) => {
      boxes[i].classList.remove('filled');
      boxes[i].classList.add(ch === currentWriteWord.word[i] ? 'correct' : 'wrong');
    });
    res.style.color = 'var(--coral)'; res.textContent = `המילה הנכונה: ${currentWriteWord.word}`;
    speak(`לא נכון. המילה הנכונה היא ${currentWriteWord.word}`);
  }
}

function nextWriting() { currentWriteIdx++; showWritingWord(); }

// ===== READ QUIZ =====
let readScore = 0, readAnswered = false, currentReadQ = null;

function nextReadQuiz() {
  readAnswered = false;
  const lt = hebrewLetters[Math.floor(Math.random() * hebrewLetters.length)];
  currentReadQ = lt;
  const q = `איזו אות זו?  ${lt.l}`;
  document.getElementById('read-question').textContent = q;
  currentTexts.read = `איזו אות זו? ${lt.name}`;
  document.getElementById('read-feedback').textContent = '';
  document.getElementById('read-next').style.display = 'none';
  const wrongs = hebrewLetters.filter(x => x.name !== lt.name).sort(() => Math.random()-0.5).slice(0,3).map(x=>x.name);
  const opts = [lt.name, ...wrongs].sort(() => Math.random()-0.5);
  const cont = document.getElementById('read-options'); cont.innerHTML = '';
  opts.forEach(o => {
    const b = document.createElement('button');
    b.className = 'opt-btn'; b.textContent = o; b.style.fontSize = '16px'; b.style.padding = '12px 6px';
    b.onclick = () => answerReadQuiz(o, b);
    cont.appendChild(b);
  });
  speak(`איזו אות זו?`);
  setTimeout(() => speak(lt.l), 1500);
}

function answerReadQuiz(val, btn) {
  if (readAnswered) return; readAnswered = true;
  document.querySelectorAll('#read-options .opt-btn').forEach(b => { b.disabled = true; if (b.textContent === currentReadQ.name) b.classList.add('correct'); });
  const fb = document.getElementById('read-feedback');
  if (val === currentReadQ.name) {
    btn.classList.add('correct'); fb.textContent = 'נכון! 🌟'; fb.className = 'feedback good';
    readScore++; document.getElementById('read-score').textContent = readScore;
    speak(`נכון מאוד! האות ${currentReadQ.name}`);
  } else {
    btn.classList.add('wrong'); fb.textContent = `האות: ${currentReadQ.name}`; fb.className = 'feedback bad';
    speak(`לא נכון. האות היא ${currentReadQ.name}`);
  }
  document.getElementById('read-next').style.display = 'block';
}

// ===== READ MODES =====
function setReadMode(m, btn) {
  document.querySelectorAll('#screen-reading .sub-tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('read-letters').style.display = m === 'letters' ? 'block' : 'none';
  document.getElementById('read-write').style.display = m === 'write' ? 'block' : 'none';
  document.getElementById('read-quiz').style.display = m === 'quiz' ? 'block' : 'none';
  if (m === 'write' && writingShuffled.length === 0) initWriting();
  if (m === 'quiz') nextReadQuiz();
}

// ===== WORLD =====
const continents = [
  {name:'אסיה',emoji:'🏯',color:'var(--amber-light)',countries:[
    {flag:'🇮🇱',heb:'ישראל',cap:'ירושלים'},
    {flag:'🇯🇵',heb:'יפן',cap:'טוקיו'},
    {flag:'🇨🇳',heb:'סין',cap:'בייג\'ינג'},
    {flag:'🇮🇳',heb:'הודו',cap:'ניו דלהי'},
    {flag:'🇸🇦',heb:'ערב הסעודית',cap:'ריאד'},
  ]},
  {name:'אירופה',emoji:'🏰',color:'var(--purple-light)',countries:[
    {flag:'🇫🇷',heb:'צרפת',cap:'פריז'},
    {flag:'🇬🇧',heb:'אנגליה',cap:'לונדון'},
    {flag:'🇩🇪',heb:'גרמניה',cap:'ברלין'},
    {flag:'🇮🇹',heb:'איטליה',cap:'רומא'},
    {flag:'🇪🇸',heb:'ספרד',cap:'מדריד'},
  ]},
  {name:'אמריקה',emoji:'🗽',color:'var(--teal-light)',countries:[
    {flag:'🇺🇸',heb:'ארצות הברית',cap:'וושינגטון'},
    {flag:'🇧🇷',heb:'ברזיל',cap:'ברזיליה'},
    {flag:'🇲🇽',heb:'מקסיקו',cap:'מקסיקו סיטי'},
    {flag:'🇨🇦',heb:'קנדה',cap:'אוטווה'},
  ]},
  {name:'אפריקה',emoji:'🦁',color:'var(--coral-light)',countries:[
    {flag:'🇪🇬',heb:'מצרים',cap:'קהיר'},
    {flag:'🇿🇦',heb:'דרום אפריקה',cap:'פרטוריה'},
    {flag:'🇳🇬',heb:'ניגריה',cap:'אבוג\'ה'},
    {flag:'🇰🇪',heb:'קניה',cap:'נירובי'},
  ]},
  {name:'אוסטרליה',emoji:'🦘',color:'var(--amber-light)',countries:[
    {flag:'🇦🇺',heb:'אוסטרליה',cap:'קנברה'},
    {flag:'🇳🇿',heb:'ניו זילנד',cap:'וולינגטון'},
  ]},
];

let worldScore = 0, worldAnswered = false, currentWorldQ = null;

function initContinents() {
  const g = document.getElementById('continent-grid'); g.innerHTML = '';
  continents.forEach(c => {
    const d = document.createElement('div'); d.className = 'continent-card';
    d.style.background = c.color;
    d.innerHTML = `<span class="cont-emoji">${c.emoji}</span><div class="cont-name">${c.name}</div>`;
    d.onclick = () => showContinent(c, d);
    g.appendChild(d);
  });
}

function showContinent(c, card) {
  document.querySelectorAll('.continent-card').forEach(x => x.classList.remove('selected'));
  card.classList.add('selected');
  document.getElementById('continent-title').textContent = c.emoji + ' ' + c.name;
  const cont = document.getElementById('countries-content'); cont.innerHTML = '';
  c.countries.forEach(co => {
    const row = document.createElement('div'); row.className = 'country-row';
    row.innerHTML = `<span class="country-flag">${co.flag}</span>
      <div style="flex:1"><div class="country-name-heb">${co.heb}</div><div class="country-capital">בירה: ${co.cap}</div></div>
      <button class="speak-btn" onclick="speak('${co.heb}. בירה: ${co.cap}')">🔊</button>`;
    cont.appendChild(row);
  });
  document.getElementById('countries-list').style.display = 'block';
  speak(`${c.name}. המדינות ביבשת זו הן: ${c.countries.map(x=>x.heb).join(', ')}`);
}

function setWorldMode(m, btn) {
  document.querySelectorAll('#screen-world .sub-tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('world-explore').style.display = m === 'explore' ? 'block' : 'none';
  document.getElementById('world-quiz').style.display = m === 'quiz' ? 'block' : 'none';
  if (m === 'quiz') nextWorldQuiz();
}

function getAllCountries() {
  return continents.flatMap(c => c.countries.map(co => ({...co, continent: c.name})));
}

function nextWorldQuiz() {
  worldAnswered = false;
  const all = getAllCountries();
  const q = all[Math.floor(Math.random() * all.length)];
  currentWorldQ = q;
  const type = Math.random() > 0.5 ? 'cap' : 'cont';
  let qText, ans, pool;
  if (type === 'cap') {
    qText = `${q.flag} ${q.heb}\nמה הבירה?`;
    currentTexts.world = `מה הבירה של ${q.heb}?`;
    ans = q.cap;
    pool = all.filter(x => x.cap !== ans).map(x => x.cap);
  } else {
    qText = `${q.flag} ${q.heb}\nבאיזו יבשת?`;
    currentTexts.world = `${q.heb} - באיזו יבשת?`;
    ans = q.continent;
    pool = continents.filter(c => c.name !== ans).map(c => c.name);
  }
  document.getElementById('world-question').textContent = qText;
  document.getElementById('world-feedback').textContent = '';
  document.getElementById('world-next').style.display = 'none';
  const opts = [ans, ...pool.sort(() => Math.random()-0.5).slice(0,3)].sort(() => Math.random()-0.5);
  const cont = document.getElementById('world-options'); cont.innerHTML = '';
  opts.forEach(o => {
    const b = document.createElement('button');
    b.className = 'opt-btn'; b.textContent = o; b.style.fontSize = '15px'; b.style.padding = '12px 6px';
    b.onclick = () => answerWorldQuiz(o, b, ans);
    cont.appendChild(b);
  });
  speak(currentTexts.world);
}

function answerWorldQuiz(val, btn, ans) {
  if (worldAnswered) return; worldAnswered = true;
  document.querySelectorAll('#world-options .opt-btn').forEach(b => { b.disabled = true; if (b.textContent === ans) b.classList.add('correct'); });
  const fb = document.getElementById('world-feedback');
  if (val === ans) {
    btn.classList.add('correct'); fb.textContent = 'מצוין! 🌍'; fb.className = 'feedback good';
    worldScore++; document.getElementById('world-score').textContent = worldScore;
    speak(`מצוין! נכון מאוד! ${ans}`);
  } else {
    btn.classList.add('wrong'); fb.textContent = `התשובה: ${ans}`; fb.className = 'feedback bad';
    speak(`לא נכון. התשובה הנכונה היא ${ans}`);
  }
  document.getElementById('world-next').style.display = 'block';
}

// INIT
initLetters();
initContinents();
initWriting();
nextMath();
</script>
